name: PR Build

on:
  pull_request:
    branches:
      - main
      - dev
      - feature/docker

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SPRING_PROFILES_ACTIVE: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 👇 Instala o JAR local no repositório Maven do runner
      - name: Install librabbitmq from local JAR
        run: |
          mvn install:install-file \
            -Dfile=./api-agendamento-serviços/docker/libs/librabbitmq-1.0-SNAPSHOT.jar \
            -DgroupId=com.automotiva.estetica.rick \
            -DartifactId=librabbitmq \
            -Dversion=1.0-SNAPSHOT \
            -Dpackaging=jar

      - name: Build and test
        working-directory: ./api-agendamento-serviços
        run: mvn clean verify
